apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-parcelize'

android {
    compileSdk = 37
    namespace "com.sudoplatform.sudositereputation"
    defaultConfig {
        minSdkVersion 26
        targetSdk = 37
        versionCode 1
        versionName "1.0"
        multiDexEnabled true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        testApplicationId = "com.sudoplatform.sudositereputation.test"
        consumerProguardFiles 'proguard-rules.pro'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            testCoverageEnabled true
        }
    }

    sourceSets {
        // add a shared test folder to share code between Robolectric and Android tests
        def sharedTestDir = 'src/sharedTest/java'
        test.java.srcDirs += sharedTestDir
        androidTest.java.srcDirs += sharedTestDir
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
        coreLibraryDesugaringEnabled true
    }

    testOptions {
        animationsDisabled = true
        unitTests.all {
            outputs.upToDateWhen {false}
        }
        unitTests {
            includeAndroidResources = true
        }
    }

    packagingOptions {
        pickFirst("META-INF/atomicfu.kotlin_module")
        pickFirst("META-INF/sudositereputation_debug.kotlin_module")
    }

    publishing {
        singleVariant("release") {
            withSourcesJar()
            withJavadocJar()
        }
    }
}

kotlin {
    jvmToolchain(21)
}

dependencies {
    // Core library desugaring
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:$coroutine_version"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$coroutine_version"
    implementation "androidx.core:core-ktx:1.19.1"

    // AWS
    //
    // AWS SDKs do not follow semantic versioning rules so we need to strictly specify AWS SDK versions.
    // Follow the process at https://anonyome.atlassian.net/wiki/spaces/PLA/pages/840073287/AWS+Android+SDK+versions+to+use+for+platform+SDKs
    // for updating AWS SDK versions.
    implementation "com.amazonaws:aws-android-sdk-core:$aws_version!!"
    implementation "com.amazonaws:aws-android-sdk-s3:$aws_version!!"

    // Amplify
    implementation "com.amplifyframework:core-kotlin:$amplify_version"
    implementation "com.amplifyframework:aws-api-appsync:$amplify_version"
    implementation "com.amplifyframework:aws-api:$amplify_version"

    // apollo codegen
    implementation "com.apollographql.apollo:apollo-runtime:4.3.3"

    // Sudo Platform SDKs
    implementation "com.sudoplatform:sudologging:6.0.0"
    implementation "com.sudoplatform:sudoconfigmanager:9.0.0"
    implementation "com.sudoplatform:sudouser:21.2.2"
    implementation 'com.sudoplatform:sudoapiclient:12.0.2'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.17'
    testImplementation 'io.kotlintest:kotlintest-runner-junit5:3.4.2'
    testImplementation "io.kotlintest:kotlintest-assertions:3.4.2"
    testImplementation "org.jetbrains.kotlin:kotlin-reflect:$kotlin_version"
    testImplementation "org.mockito:mockito-core:5.24.0"
    testImplementation "org.mockito.kotlin:mockito-kotlin:6.4.0"
    testImplementation "androidx.test:core:1.7.0"
    testImplementation 'org.awaitility:awaitility:4.3.0'
    testImplementation "com.jakewharton.timber:timber:5.0.1"
    testImplementation "org.json:json:20260814"
    androidTestImplementation project(':sudositereputation')
    testRuntimeOnly 'org.slf4j:slf4j-jdk14:2.0.20' // To suppress log noise

    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation "androidx.test:core:1.7.0"
    androidTestImplementation "io.kotlintest:kotlintest-assertions:3.4.2"
    // Awaitility >= 4.x.x brings incompatible hamcrest 2.1 with it
    androidTestImplementation 'org.awaitility:awaitility-kotlin:3.1.6'
    androidTestImplementation "com.google.guava:guava:33.7.1-android"
    androidTestImplementation "com.sudoplatform:sudokeymanager:9.0.1"
    androidTestImplementation 'com.sudoplatform:sudoentitlements:13.0.1'
    androidTestImplementation 'com.sudoplatform:sudoentitlementsadmin:11.0.1'
    androidTestImplementation "com.jakewharton.timber:timber:5.0.1"
}

// Vulnerability scanning (OWASP dependency-check)
if (project.file("${rootProject.projectDir}/util/vulnerability-scan.gradle").exists()) {
    apply from: "${rootProject.projectDir}/util/vulnerability-scan.gradle"
}

afterEvaluate {
    tasks.matching { it.name.toLowerCase().contains("sourcesjar") || it.name.toLowerCase().contains("sourcejar") }.configureEach {
        dependsOn("generateServiceApolloSources")
    }
}

// Kotlin Lint
apply plugin: 'org.jmailen.kotlinter'

kotlinter {
    reporters = ['checkstyle', 'plain']
}

// Exclude the apollographql-generated classes from linting.
tasks.withType(org.jmailen.gradle.kotlinter.tasks.LintTask).configureEach {
    mustRunAfter("generateServiceApolloSources")
    exclude { it.file.path.contains("generated/") }
}
tasks.withType(org.jmailen.gradle.kotlinter.tasks.FormatTask).configureEach {
    mustRunAfter("generateServiceApolloSources")
    exclude { it.file.path.contains("generated/") }
}

apply plugin: "com.apollographql.apollo"
apollo {
    service("service") {
        packageName.set("com.sudoplatform.sudositereputation.graphql")
    }
}

// Generate .editorconfig in the root directory of the project being built
static void generateEditorConfig(final Project project) {
    File editorConfig = new File("${project.rootDir}/.editorconfig")
    editorConfig.write("root = true\n")
    editorConfig.write("[*.{kt,kts}]\n")
    editorConfig.append("indent_style=space\n")
    editorConfig.append("indent_size=4\n")
    editorConfig.append("max_line_length=140\n")
    editorConfig.append("ij_continuation_indent_size=4\n")
    editorConfig.append("trim_trailing_whitespace=true\n")
    editorConfig.append("insert_final_newline=true\n")
    editorConfig.append("[*.xml]\n")
    editorConfig.append("trim_trailing_whitespace=true\n")
    editorConfig.append("insert_final_newline=true\n")
}

afterEvaluate {
    generateEditorConfig(project)
}

// Jacoco test coverage
apply plugin: 'jacoco'

jacoco {
    toolVersion = "0.8.15"
}

tasks.register('jacocoTestReport', JacocoReport) {
    dependsOn("testDebugUnitTest")
    group = "Reporting"
    description = "Generate Jacoco coverage reports"
    classDirectories.setFrom(
            fileTree(
                    dir: "${layout.buildDirectory.get()}/tmp/kotlin-classes/debug",
                    excludes: [
                            '**/R.class',
                            '**/R$*.class',
                            '**/BuildConfig.*',
                            '**/Manifest*.*'
                    ]
            )
    )
    sourceDirectories.setFrom(files("${layout.projectDirectory}/sudositereputation/src/main/java"))
    executionData.setFrom(fileTree(["dir":"${layout.buildDirectory.get()}", "includes":["**/*.exec", "**/*.ec"]]))
}

apply plugin: 'org.jetbrains.dokka'

dokkaHtml {
    outputDirectory.set(project.file("${layout.buildDirectory.get()}/javadoc"))

    dokkaSourceSets {
        configureEach {
            jdkVersion.set(8)
            skipEmptyPackages.set(true)
            includes.from("packages.md")
        }
    }
}

// Setup common publishing variables
ext {
    projectArtifact = project.name
    projectDescription = 'Site Reputation SDK for the Sudo Platform by Anonyome Labs.'
    projectUrl = 'https://github.com/sudoplatform/sudo-site-reputation-android'
    projectSCM = 'scm:git:github.com/sudoplatform/sudo-site-reputation-android.git'
    if (project.findProperty("tag")) {
        projectVersion = "$tag"
    } else {
        projectVersion = project.android.defaultConfig.versionName
    }
}

// Internal and External publishing
if (project.findProperty("tag") && project.file("${rootProject.projectDir}/util/publish-mavencentral.gradle").exists()) {
    apply from: "${rootProject.projectDir}/util/publish-mavencentral.gradle"
} else if (project.file("${rootProject.projectDir}/util/publish-internal-android.gradle").exists()) {
    apply from: "${rootProject.projectDir}/util/publish-internal-android.gradle"
}

// Sonarqube code analysis
if (project.file("${rootProject.projectDir}/util/sonarqube.gradle").exists()) {
    ext.sonarProjectKey = "sudo-sitereputation-android"
    ext.sonarProjectName = "sudo-sitereputation-android"
    ext.sonarExclusions = ["*.png", "*.jks", "*.json", "*.key", "src/main/AndroidManifest.xml"]
    apply from: "${rootProject.projectDir}/util/sonarqube.gradle"
}

// License checking - only include this not publishing externally. Presence of "tag" property means publishing externally.
if (project.file("${rootProject.projectDir}/util/license-tools.gradle").exists() && !project.hasProperty("tag")) {
    apply from: "${rootProject.projectDir}/util/license-tools.gradle"
}
